<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock FNO Historical</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background:#0b1220; color:#e7eefc; }
    .wrap { padding: 12px; }
    .card { background:#0f1a33; border:1px solid #23315b; border-radius:10px; padding:10px; margin-bottom:10px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
    .field { display:flex; flex-direction:column; gap:4px; }
    label { font-size:12px; color:#95a3c7; }
    input, button { background:#0b142c; color:#e7eefc; border:1px solid #223260; border-radius:8px; padding:6px 8px; }
    button { cursor:pointer; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .hint { font-size:12px; color:#95a3c7; }
    #status { font-size:12px; color:#9fd4ff; }
    canvas { width:100% !important; height:66vh !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <form id="form">
        <div class="row">
          <div class="field">
            <label>Symbol</label>
            <input id="symbol" list="symbolHints" placeholder="RELIANCE" required />
            <datalist id="symbolHints"></datalist>
          </div>
          <div class="field">
            <label>Expiry Date</label>
            <input id="expiry" type="date" required />
          </div>
          <div class="field">
            <label>Start Date</label>
            <input id="start" type="date" required />
          </div>
          <div class="field">
            <label>End Date (optional)</label>
            <input id="end" type="date" />
          </div>
          <button type="submit">Submit</button>
        </div>
      </form>
      <div id="status"></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <button id="addLine" type="button">Add Horizontal Line</button>
        <input id="linePrice" type="number" step="0.05" placeholder="Price for line" style="width:140px;" />
        <button id="addLineAtPrice" type="button">Add At Price</button>
        <button id="deleteLast" type="button">Delete Last Line</button>
        <button id="clearAll" type="button">Clear All Lines</button>
        <span class="hint">Click chart after "Add" to place a line.</span>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const hLines = [];
    let fullTimestamps = [];
    let dayCloseFlags = [];
    let addLineMode = false;

    const hLinePlugin = {
      id: "horizontalLines",
      afterDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea || !scales.y) return;
        ctx.save();
        for (const ln of hLines) {
          const y = scales.y.getPixelForValue(ln.value);
          ctx.beginPath();
          ctx.strokeStyle = "#f59e0b";
          ctx.setLineDash([6, 4]);
          ctx.moveTo(chartArea.left, y);
          ctx.lineTo(chartArea.right, y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#f59e0b";
          ctx.fillText(ln.label, chartArea.left + 6, y - 6);
        }
        ctx.restore();
      }
    };

    const chart = new Chart(document.getElementById("chart").getContext("2d"), {
      type: "line",
      data: { labels: [], datasets: [
        {
          label: "Close",
          data: [],
          borderColor:"#4fa3ff",
          pointRadius: (ctx) => (dayCloseFlags[ctx.dataIndex] ? 4 : 0),
          pointHoverRadius: (ctx) => (dayCloseFlags[ctx.dataIndex] ? 7 : 4),
          pointBackgroundColor: (ctx) => (dayCloseFlags[ctx.dataIndex] ? "#d946ef" : "rgba(0,0,0,0)"),
          pointBorderColor: (ctx) => (dayCloseFlags[ctx.dataIndex] ? "#ffffff" : "rgba(0,0,0,0)"),
          pointBorderWidth: (ctx) => (dayCloseFlags[ctx.dataIndex] ? 1.5 : 0),
          borderWidth:1.8,
          tension:0.15
        },
        { label: "Volume", data: [], borderColor:"#f97316", pointRadius:0, borderWidth:1, tension:0.15, yAxisID:"y1" }
      ]},
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { labels: { color:"#e7eefc" } },
          tooltip: {
            callbacks: {
              title(items) {
                if (!items || items.length === 0) return "";
                const i = items[0].dataIndex;
                return fullTimestamps[i] || items[0].label || "";
              },
              label(ctx) {
                const v = Number(ctx.parsed.y);
                if (ctx.dataset.label === "Close") {
                  return `Close: ${Number.isFinite(v) ? v.toFixed(2) : "-"}`;
                }
                return `Volume: ${Number.isFinite(v) ? v.toLocaleString() : "-"}`;
              }
            }
          }
        },
        scales: {
          x: { ticks:{ color:"#95a3c7" }, grid:{ color:"#253055" } },
          y: { ticks:{ color:"#95a3c7" }, grid:{ color:"#253055" } },
          y1: { position:"right", ticks:{ color:"#95a3c7" }, grid:{ drawOnChartArea:false } }
        }
      },
      plugins: [hLinePlugin]
    });

    document.getElementById("chart").onclick = (evt) => {
      if (!addLineMode) return;
      const p = Chart.helpers.getRelativePosition(evt, chart);
      const yVal = chart.scales.y.getValueForPixel(p.y);
      if (Number.isFinite(yVal)) {
        hLines.push({ value: yVal, label: "H: " + yVal.toFixed(2) });
        chart.update("none");
      }
      addLineMode = false;
      statusEl.textContent = "Line added.";
    };

    document.getElementById("addLine").onclick = () => {
      addLineMode = true;
      statusEl.textContent = "Click on chart to place horizontal line.";
    };
    document.getElementById("addLineAtPrice").onclick = () => {
      const inp = document.getElementById("linePrice");
      const p = Number(inp.value);
      if (!Number.isFinite(p)) {
        statusEl.textContent = "Enter a valid line price.";
        return;
      }
      hLines.push({ value: p, label: "H: " + p.toFixed(2) });
      chart.update("none");
      statusEl.textContent = "Line added at price.";
    };
    document.getElementById("deleteLast").onclick = () => {
      if (hLines.length > 0) hLines.pop();
      chart.update("none");
    };
    document.getElementById("clearAll").onclick = () => {
      hLines.length = 0;
      chart.update("none");
    };

    async function refreshSymbolHints() {
      const q = (document.getElementById("symbol").value || "").trim();
      if (!q) return;
      try {
        const r = await fetch(`/backtest/stock-fno/symbols?q=${encodeURIComponent(q)}&limit=20`);
        if (!r.ok) return;
        const j = await r.json();
        if (j.status !== "ok" || !Array.isArray(j.symbols)) return;
        const dl = document.getElementById("symbolHints");
        dl.innerHTML = "";
        for (const s of j.symbols) {
          const o = document.createElement("option");
          const base = s.base_symbol || s.code || "";
          o.value = base;
          o.label = `${base} (${s.code || ""}) - ${s.name || ""}`;
          dl.appendChild(o);
        }
      } catch (_) {}
    }
    document.getElementById("symbol").addEventListener("input", refreshSymbolHints);
    document.getElementById("symbol").addEventListener("focus", refreshSymbolHints);

    const expiryEl = document.getElementById("expiry");
    const endEl = document.getElementById("end");
    expiryEl.addEventListener("change", () => {
      // Default end date to expiry date; user can still edit manually.
      if (expiryEl.value) endEl.value = expiryEl.value;
    });

    function toHHMM(ts) {
      const s = String(ts || "").replace("T", " ");
      const parts = s.split(" ");
      return parts.length > 1 ? parts[1].slice(0,5) : s.slice(11,16);
    }

    function datePart(ts) {
      const s = String(ts || "").replace("T", " ");
      return s.slice(0, 10);
    }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      // Clear previous run for visual clarity before loading next request.
      hLines.length = 0;
      fullTimestamps = [];
      dayCloseFlags = [];
      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.data.datasets[1].data = [];
      chart.update("none");
      const payload = {
        symbol: document.getElementById("symbol").value.trim().toUpperCase(),
        expiry_date: document.getElementById("expiry").value,
        start_date: document.getElementById("start").value,
        end_date: document.getElementById("end").value || null
      };
      statusEl.textContent = "Loading...";
      try {
        const r = await fetch("/backtest/stock-fno/historical", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const j = await r.json();
        if (!r.ok || j.status !== "ok") throw new Error(j.detail || j.message || "Request failed");
        const candles = j.candles || [];
        fullTimestamps = candles.map(c => c.timestamp);
        dayCloseFlags = candles.map((c, i) => {
          const cur = datePart(c.timestamp);
          const next = i + 1 < candles.length ? datePart(candles[i + 1].timestamp) : "";
          return i === candles.length - 1 || cur !== next;
        });
        chart.data.labels = candles.map(c => toHHMM(c.timestamp));
        chart.data.datasets[0].data = candles.map(c => Number(c.close));
        chart.data.datasets[1].data = candles.map(c => Number(c.volume));
        chart.update("none");
        statusEl.textContent = `Loaded ${candles.length} candles from ${j.source}. DB: ${j.db_path}`;
      } catch (err) {
        statusEl.textContent = String(err.message || err);
      }
    };
  </script>
</body>
</html>
